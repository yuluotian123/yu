<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e9">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; --paper: #f7f3e9; --ink: #263e42; --muted: #7c8985; --accent: #e87654; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    main { width: min(1240px, 100%); margin: 0 auto; padding: 28px 36px 20px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 38px; height: 38px; }
    .brand-name { font-weight: 750; font-size: 12px; letter-spacing: .2em; }
    .brand-sub { margin-top: 3px; font-size: 11px; color: var(--muted); letter-spacing: .17em; }
    .edition { font-size: 11px; letter-spacing: .15em; color: var(--muted); white-space: nowrap; }
    .card { overflow: hidden; position: relative; border: 1px solid #dfdfd1; border-radius: 24px; background: #f4eddc; box-shadow: 0 18px 70px #263e4209; }
    .headline { position: absolute; z-index: 1; left: 4.7%; top: 6%; pointer-events: none; }
    .eyebrow { color: #728b80; font-size: 10px; letter-spacing: .23em; font-weight: 700; }
    h1 { margin: 13px 0 12px; font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif; font-size: clamp(25px, 3.3vw, 45px); font-weight: 600; letter-spacing: .045em; }
    .headline p { margin: 0; font-size: clamp(10px, 1.1vw, 13px); color: #7c8c80; letter-spacing: .08em; }
    #scene { display: block; width: 100%; height: auto; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 17px 23px; border-top: 1px solid #dbddce; background: #faf8f0; }
    .transport, .speed { display: flex; align-items: center; gap: 13px; }
    .play { display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 50%; color: #fffaf0; background: var(--ink); cursor: pointer; transition: background .18s, transform .18s; }
    .play:hover { background: #426564; transform: translateY(-1px); }
    .play svg { width: 16px; height: 16px; }
    .status { font-size: 12px; font-weight: 600; letter-spacing: .04em; }
    .status small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 400; letter-spacing: .09em; }
    .speed label { color: #75857f; font-size: 11px; }
    .speed output { width: 39px; color: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 118px; height: 4px; accent-color: #628e80; cursor: pointer; }
    .reset { border: 1px solid #dce2d7; background: transparent; color: #74857d; width: 33px; height: 33px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
    .reset:hover { background: #edf0e5; }
    .reset svg { width: 15px; height: 15px; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e9a674; outline-offset: 5px; }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 16px; padding: 0 3px; color: #89928a; font-size: 10px; letter-spacing: .1em; }
    .motion-line { fill: none; stroke: #809c8a; stroke-width: 2; stroke-linecap: round; }
    .outlined { stroke: #263e42; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 650px) {
      main { padding: 20px 13px; }
      .masthead { padding: 0 5px; margin-bottom: 18px; }
      .edition { display: none; }
      .card { border-radius: 18px; }
      .headline { top: 6%; left: 6%; }
      .eyebrow { font-size: 7px; letter-spacing: .15em; }
      h1 { margin: 7px 0 6px; font-size: clamp(19px, 5vw, 30px); }
      .headline p { font-size: 8px; max-width: 160px; line-height: 1.7; }
      .controls { padding: 13px; gap: 10px; }
      .transport, .speed { gap: 8px; }
      .play { width: 36px; height: 36px; }
      .status { font-size: 10px; }
      .status small { font-size: 8px; }
      input[type="range"] { width: 70px; }
      .speed label { display: none; }
      .reset { width: 28px; height: 28px; }
      footer { font-size: 8px; letter-spacing: .04em; }
    }
  </style>
</head>
<body>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const ns = 'http://www.w3.org/2000/svg';
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const play = $('play');
      const speedInput = $('speed');
      let paused = reducedMotion.matches;
      let speed = 1;
      let time = 0;
      let previous = null;

      // 两根连杆求膝盖位置，脚始终落在旋转曲柄的端点上。
      function knee(hip, foot, upper, lower) {
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.max(0.001, Math.hypot(dx, dy));
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
        return { x: hip.x + dx * along / distance + dy * offset / distance,
                 y: hip.y + dy * along / distance - dx * offset / distance };
      }

      function spokes(id, cx, cy) {
        for (let i = 0; i < 12; i++) {
          const angle = i * Math.PI / 6;
          const line = document.createElementNS(ns, 'line');
          line.setAttribute('x1', cx); line.setAttribute('y1', cy);
          line.setAttribute('x2', cx + Math.cos(angle) * 81);
          line.setAttribute('y2', cy + Math.sin(angle) * 81);
          $(id).appendChild(line);
        }
      }
      spokes('rear-spokes', 380, 491);
      spokes('front-spokes', 655, 491);
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        const line = document.createElementNS(ns, 'line');
        for (const [attribute, value] of Object.entries({
          x1: 508 + Math.cos(a) * 9, y1: 487 + Math.sin(a) * 9,
          x2: 508 + Math.cos(a) * 21, y2: 487 + Math.sin(a) * 21
        })) line.setAttribute(attribute, value);
        $('chainring').appendChild(line);
      }

      const move = (id, x, y = 0) => $(id).setAttribute('transform', `translate(${x} ${y})`);
      const rotate = (id, angle, x, y) => $(id).setAttribute('transform', `rotate(${angle} ${x} ${y})`);

      function leg(side, angle, bob) {
        const foot = { x: 508 + Math.cos(angle) * 37, y: 487 + Math.sin(angle) * 37 };
        const hip = { x: side === 'near' ? 477 : 488, y: 345 + bob };
        const joint = knee(hip, foot, 96, 99);
        const path = `M${hip.x} ${hip.y}L${joint.x} ${joint.y}L${foot.x} ${foot.y}`;
        $(`${side}-leg-line`).setAttribute('d', path);
        if (side === 'near') $('near-leg-highlight').setAttribute('d', path);
        move(`${side}-pedal`, foot.x, foot.y);
        $(`${side}-foot`).setAttribute('transform', `translate(${foot.x} ${foot.y - 3}) rotate(${Math.sin(angle - .6) * 8})`);
        return foot;
      }

      function paint(t) {
        const crankAngle = t * Math.PI * 1.4;
        const wheelAngle = crankAngle * 1.2;
        const degrees = wheelAngle * 180 / Math.PI;
        const bob = Math.sin(crankAngle * 2 - .4) * 2.1;
        rotate('rear-spokes', degrees, 380, 491);
        rotate('front-spokes', degrees, 655, 491);
        rotate('rear-wheel-mark', degrees, 380, 491);
        rotate('front-wheel-mark', degrees, 655, 491);
        rotate('chainring', crankAngle * 180 / Math.PI, 508, 487);
        const near = leg('near', crankAngle, bob);
        const far = leg('far', crankAngle + Math.PI, bob);
        $('crank').setAttribute('d', `M${near.x} ${near.y}L${far.x} ${far.y}`);
        move('bird', 0, bob);
        // 翅膀跟随肩膀起伏，握车把的一端保持原位。
        $('front-wing').setAttribute('d', `M512 ${276 + bob}Q547 ${284 + bob} 565 309L611 328Q620 333 613 341Q588 342 553 323Q521 ${310 + bob} 512 ${293 + bob}Z`);
        move('wing-feathers', 0, bob * .3);
        rotate('rear-wing', Math.sin(crankAngle - .7) * 2, 469, 284);
        rotate('cap-ribbon', Math.sin(t * 5) * 4, 615, 143);

        const distance = wheelAngle * 92;
        move('road', -(distance % 188));
        move('road-grit', -(distance % 104));
        move('plants-back', -((distance * .72) % 1120));
        move('plants-front', -((distance * 1.12) % 1120));
        move('water', -((distance * .055) % 360));
        move('clouds', -((t * 7) % 1330));
        move('gulls', -((t * 12) % 1100), Math.sin(t * 1.3) * 3);
        $('breeze').setAttribute('opacity', .5 + Math.sin(t * 3) * .2);
        $('shadow').setAttribute('rx', 221 + Math.sin(crankAngle * 2) * 2);
      }

      function syncControls() {
        play.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        play.setAttribute('aria-pressed', String(paused));
        $('play-icon').setAttribute('d', paused ? 'M5 2.5L13 8L5 13.5Z' : 'M4 3h3v10H4zM9 3h3v10H9z');
        $('status').textContent = paused ? '歇一小会儿' : '正在兜风';
        $('speed-value').value = `${speed.toFixed(1)}×`;
        speedInput.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
      }
      play.addEventListener('click', () => { paused = !paused; syncControls(); });
      speedInput.addEventListener('input', () => { speed = Number(speedInput.value); syncControls(); });
      $('reset').addEventListener('click', () => {
        time = 0; speed = 1; speedInput.value = '1';
        paused = reducedMotion.matches; paint(time); syncControls();
      });
      reducedMotion.addEventListener('change', event => {
        if (event.matches) { paused = true; syncControls(); }
      });
      document.addEventListener('visibilitychange', () => { previous = null; });

      function tick(now) {
        const delta = previous === null ? 0 : Math.min((now - previous) / 1000, .05);
        previous = now;
        if (!paused && !document.hidden) { time += delta * speed; paint(time); }
        requestAnimationFrame(tick);
      }
      paint(0);
      syncControls();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
