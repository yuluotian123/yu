 if(state==='targeting'){const match=e.code.match(/^(?:Digit|Numpad)([1-4])$/);if(match){chooseLimb(LIMBS[Number(match[1])-1].id);return;}if(e.code==='Enter'){chooseLimb(focus.hover||availableLimbs(focus.target)[0]?.id);return;}}
 if(e.code==='Enter'){if(state==='intro'||state==='won')beginRun();else if(state==='briefing'){state='playing';hideOverlay();canvas.focus();}else if(state==='dead')retry();else if(state==='paused')resume();return;}
 if(e.code==='KeyR'){retry();return;}
 if(state!=='playing')return;keys.add(e.code);if(e.code==='KeyF')tryExecution();if(e.code==='KeyQ')throwArm('blade');if(e.code==='KeyE')throwArm('gun');if(e.code==='Space')dodge();if(e.code==='KeyZ')spinAttack();if(e.code==='KeyX')interact();
});
document.addEventListener('keyup',e=>keys.delete(e.code));
function onBlur(){keys.clear();leftDown=rightDown=false;touchMove={x:0,y:0};if(isCombatState()){pauseGame();updateUI();}}
window.addEventListener('blur',onBlur);document.addEventListener('visibilitychange',()=>{if(document.hidden)onBlur();});
function toggleSound(){muted=!muted;Sound.resume();if(Sound.bus)Sound.bus.gain.setTargetAtTime(muted?0:.24,Sound.ctx.currentTime,.06);$('soundSlash').style.display=muted?'':'none';$('soundBtn').setAttribute('aria-pressed',String(!muted));$('soundBtn').setAttribute('aria-label',muted?'开启声音':'关闭声音');try{localStorage.setItem('rebody-muted',muted?'1':'0');}catch(_){}}
$('soundSlash').style.display=muted?'':'none';$('soundBtn').setAttribute('aria-pressed',String(!muted));$('soundBtn').setAttribute('aria-label',muted?'开启声音':'关闭声音');$('soundBtn').onclick=toggleSound;$('pauseBtn').onclick=()=>{pauseGame();updateUI();};
$('fullscreenBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('gameShell').requestFullscreen();}catch(_){toast('当前浏览器未提供全屏。可使用浏览器的全屏功能。');}};
const joystick=$('joystick');joystick.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();activeStick=e.pointerId;joystick.setPointerCapture(e.pointerId);touchMode=true;moveStick(e);});
function moveStick(e){if(e.pointerId!==activeStick)return;const b=joystick.getBoundingClientRect(),dx=e.clientX-b.left-b.width/2,dy=e.clientY-b.top-b.height/2,len=Math.max(1,Math.hypot(dx,dy)/33);touchMove={x:dx/len/33,y:dy/len/33};$('stick').style.transform='translate('+touchMove.x*30+'px,'+touchMove.y*30+'px)';}
joystick.addEventListener('pointermove',moveStick);function releaseStick(e){if(e.pointerId!==activeStick)return;activeStick=null;touchMove={x:0,y:0};$('stick').style.transform='';}joystick.addEventListener('pointerup',releaseStick);joystick.addEventListener('pointercancel',releaseStick);
function touchButton(id,fn,held){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='playing')return;touchMode=true;b.setPointerCapture(e.pointerId);Sound.resume();if(held==='left')leftDown=true;if(held==='right')rightDown=true;fn();});const end=()=>{if(held==='left')leftDown=false;if(held==='right')rightDown=false;};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);}
touchButton('touchThrowLeft',()=>throwArm('blade'));touchButton('touchThrowRight',()=>throwArm('gun'));touchButton('touchExecute',tryExecution);touchButton('touchAttack',slash,'left');touchButton('touchFire',fire,'right');touchButton('touchEquip',interact);touchButton('touchDash',dodge);touchButton('touchSkill',spinAttack);
new ResizeObserver(resize).observe(stage);window.addEventListener('resize',resize);
loadLevel(0);showIntro();resize();updateUI();let last=0;
function frame(now){const dt=Math.min((now-last)/1000||.016,.035);last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
