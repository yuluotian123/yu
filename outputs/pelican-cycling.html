<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f0">
  <title>鹈鹕的海岸骑行 · Pelican on a Bicycle</title>
  <style>
    :root { color-scheme: light; --paper:#f8f7f0; --ink:#254b42; --muted:#7a8980; --green:#326554; --line:#dedfd3; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible { outline:3px solid #e4a756; outline-offset:5px; }
    .page { max-width:1240px; margin:0 auto; padding:32px 48px 22px; }
    .masthead { display:flex; align-items:center; justify-content:space-between; padding-bottom:23px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:2px; }
    .brand svg { width:30px; height:22px; }
    .edition { color:var(--muted); font-size:10px; letter-spacing:2px; }
    .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:38px 0 28px; }
    .eyebrow { margin:0 0 12px; font-size:10px; letter-spacing:3px; color:var(--muted); }
    h1 { margin:0; font-size:clamp(28px,4vw,44px); letter-spacing:3px; line-height:1.4; font-weight:600; }
    .intro-note { margin:0 0 5px; font-size:12px; line-height:1.9; color:var(--muted); text-align:right; }
    .scene { position:relative; overflow:hidden; border-radius:12px; background:#e7f0e6; border:1px solid #dce5d9; }
    .scene > svg { display:block; width:100%; height:auto; }
    .scene-label { position:absolute; top:25px; left:28px; display:flex; align-items:center; gap:8px; color:#5e7c6b; font-size:10px; letter-spacing:2px; }
    .scene-label::before { content:""; width:5px; height:5px; border-radius:50%; background:#668d71; }
    .scene-index { position:absolute; top:25px; right:28px; font:11px Georgia,serif; letter-spacing:2px; color:#7e9983; }
    .controls { display:flex; justify-content:space-between; align-items:center; gap:24px; padding:25px 2px; border-bottom:1px solid var(--line); }
    .transport { display:flex; align-items:center; gap:13px; }
    .play { border:0; border-radius:50%; background:var(--green); color:white; width:44px; height:44px; display:grid; place-items:center; transition:background .2s,transform .2s; }
    .play:hover { background:#244f40; transform:scale(1.04); }
    .play svg { width:16px; height:16px; }
    .transport-copy { display:flex; flex-direction:column; gap:5px; min-width:90px; }
    .transport-copy strong { font-size:12px; font-weight:500; }
    .transport-copy span { font-size:10px; color:var(--muted); letter-spacing:.4px; }
    .reset { display:grid; place-items:center; width:34px; height:34px; margin-left:10px; background:transparent; border:1px solid var(--line); border-radius:50%; color:#66806e; }
    .reset:hover { background:#eaf0e4; }
    .reset svg { width:15px; height:15px; }
    .speed-control { display:flex; gap:15px; align-items:center; font-size:11px; }
    .speed-control label { color:var(--muted); }
    input[type="range"] { width:145px; height:20px; accent-color:var(--green); cursor:pointer; }
    output { min-width:34px; color:var(--green); font-variant-numeric:tabular-nums; }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-top:21px; color:var(--muted); font-size:10px; letter-spacing:.5px; }
    .footer p { margin:0; }
    .footer .motto { color:#627e6c; }
    kbd { font:inherit; padding:2px 5px; border:1px solid #d9ddcf; border-radius:3px; }
    @media(max-width:650px) {
      .page { padding:22px 18px; }
      .brand { font-size:10px; letter-spacing:1px; }
      .edition { font-size:8px; letter-spacing:1px; }
      .intro { padding:27px 0 22px; display:block; }
      .intro-note { text-align:left; margin:12px 0 0; font-size:11px; }
      .intro-note br { display:none; }
      .scene-label { top:16px; left:17px; font-size:8px; letter-spacing:1px; }
      .scene-index { top:16px; right:17px; font-size:9px; }
      .scene > svg { min-height:310px; object-fit:cover; }
      .controls { flex-wrap:wrap; gap:20px; padding:20px 0; }
      .speed-control { flex:1; justify-content:flex-end; gap:8px; }
      input[type="range"] { width:100px; }
      .footer { align-items:flex-start; line-height:1.8; }
      .keyboard-hint { display:none; }
    }
    @media(max-width:380px) { .speed-control { flex-basis:100%; justify-content:flex-start; } input[type="range"] { flex:1; } }
  </style>
</head>
<body>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const parts = Object.fromEntries(['clouds','sea-lines','road-dashes','back-plants','front-plants','rear-spokes','front-spokes','rider-rig','pelican','pelican-eye','scarf-tail','scarf-tail-small','crank','far-leg','far-leg-outline','far-foot','near-leg','near-leg-outline','near-foot','near-pedal','far-pedal','breeze','bike-shadow'].map(id => [id,$(id)]));
    let playing = !motionPreference.matches;
    let speed = 1;
    let time = 0;
    let previous = null;
    let request = 0;
    let lastDistance = '';
    const TAU = Math.PI * 2;
    function leg(side, angle, bob) {
      const x = 548 + 31 * Math.cos(angle);
      const y = 470 + 31 * Math.sin(angle);
      const hipX = side === 'far' ? 486 : 496;
      const hipY = 338 + bob;
      const dx = x - hipX, dy = y - hipY;
      const length = Math.hypot(dx,dy);
      const kneeOffset = Math.sqrt(Math.max(0, 96 * 96 - length * length / 4));
      const kneeX = (hipX+x)/2 + dy/length*kneeOffset;
      const kneeY = (hipY+y)/2 - dx/length*kneeOffset;
      const d = `M${hipX} ${hipY}Q${kneeX-3} ${kneeY-3} ${kneeX} ${kneeY}L${x} ${y}`;
      parts[side+'-leg'].setAttribute('d',d);
      parts[side+'-leg-outline'].setAttribute('d',d);
      parts[side+'-foot'].setAttribute('d',`M${x-7} ${y-2}h26l-5-8-7 5-8-3Z`);
      parts[side+'-pedal'].setAttribute('d',`M${x-9} ${y+3}h23`);
      return {x,y};
    }
    function render() {
      const cycle = time * 2.4;
      const bob = Math.sin(cycle*2)*1.8;
      const wheelDegrees = time*180/79*180/Math.PI % 360;
      parts['rider-rig'].setAttribute('transform',`translate(0 ${Math.sin(time*4.8)*.65})`);
      parts.pelican.setAttribute('transform',`translate(0 ${bob})`);
      parts['rear-spokes'].setAttribute('transform',`rotate(${wheelDegrees})`);
      parts['front-spokes'].setAttribute('transform',`rotate(${wheelDegrees})`);
      const near = leg('near',cycle,bob);
      const far = leg('far',cycle+Math.PI,bob);
      parts.crank.setAttribute('d',`M${far.x} ${far.y}L${near.x} ${near.y}`);
      parts.clouds.setAttribute('transform',`translate(${-time*7%1260} 0)`);
      parts['sea-lines'].setAttribute('patternTransform',`translate(${-time*18%280} 0)`);
      parts['road-dashes'].setAttribute('patternTransform',`translate(${-time*180%200} 0)`);
      parts['back-plants'].setAttribute('transform',`translate(${-time*100%1120} 0)`);
      parts['front-plants'].setAttribute('transform',`translate(${-time*180%1120} 0)`);
      const flutter = Math.sin(time*7)*4;
      parts['scarf-tail'].setAttribute('d',`M515 252C488 ${242+flutter} 469 ${258-flutter} 440 ${245+flutter}l9 15-12 7c35 7 52-10 77-4Z`);
      parts['scarf-tail-small'].setAttribute('transform',`rotate(${Math.sin(time*7+1)*3} 518 254)`);
      const blink = time%5.7;
      parts['pelican-eye'].setAttribute('transform',`translate(565 181) scale(1 ${blink>5.5 ? .12 : 1})`);
      parts.breeze.setAttribute('transform',`translate(${-12+Math.sin(time*2)*8} 0)`);
      parts.breeze.setAttribute('opacity',String(.3+Math.sin(time*2)*.15));
      parts['bike-shadow'].setAttribute('rx',String(211+Math.sin(cycle*2)*3));
      const distance = `已骑行 ${(time*12/3600).toFixed(2)} km`;
      if (distance !== lastDistance) { $('ride-distance').textContent=distance; lastDistance=distance; }
    }
    // Duplicate repeating scenery at fixed SVG offsets so the loop has no gap.
    function repeatScenery(id, period) {
      const group = parts[id];
      const originals = [...group.children];
      for (const shift of [-period,period,period*2]) {
        const copy = document.createElementNS('http://www.w3.org/2000/svg','g');
        copy.setAttribute('transform',`translate(${shift} 0)`);
        for (const original of originals) copy.appendChild(original.cloneNode(true));
        group.appendChild(copy);
      }
    }
    repeatScenery('clouds',1260);
    repeatScenery('back-plants',1120);
    repeatScenery('front-plants',1120);
    function updateControls() {
      $('play-toggle').setAttribute('aria-label',playing?'暂停动画':'继续动画');
      $('play-toggle').setAttribute('aria-pressed',String(!playing));
      $('play-state').textContent=playing?'正在兜风':'休息一下';
      $('play-icon').innerHTML=playing?'<path d="M5 3v10M11 3v10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>':'<path d="m5 3 8 5-8 5Z" fill="currentColor"/>';
    }
    function tick(now) {
      request=0;
      if (!playing || document.hidden) { previous=null; return; }
      if (previous !== null) time+=Math.min((now-previous)/1000,.05)*speed;
      previous=now;
      render();
      request=requestAnimationFrame(tick);
    }
    function schedule() { previous=null; if (playing&&!document.hidden&&!request) request=requestAnimationFrame(tick); }
    function setPlaying(value) {
      playing=value;
      if (request) { cancelAnimationFrame(request); request=0; }
      updateControls(); schedule();
    }
    $('play-toggle').addEventListener('click',()=>setPlaying(!playing));
    $('restart').addEventListener('click',()=>{time=0;previous=null;render();});
    $('speed').addEventListener('input',event=>{
      speed=Number(event.target.value);
      $('speed-value').value=`${speed.toFixed(2)}×`;
      event.target.setAttribute('aria-valuetext',`${speed.toFixed(2)} 倍速`);
    });
    document.addEventListener('keydown',event=>{
      if (event.code!=='Space'||event.repeat||/^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      event.preventDefault(); setPlaying(!playing);
    });
    document.addEventListener('visibilitychange',()=>{
      if (document.hidden && request) { cancelAnimationFrame(request); request=0; previous=null; }
      else schedule();
    });
    motionPreference.addEventListener('change',event=>setPlaying(!event.matches));
    render(); updateControls(); schedule();
  })();
  </script>
</body>
</html>
